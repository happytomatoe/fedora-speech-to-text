# E2E test configuration for voice-to-text
transcription:
  mode: "batch"
  provider: "deepgram"
  language: "en"

deepgram:
  api_key_env: "DEEPGRAM_API_KEY"
  model: "nova-3"
  batch_options:
    smart_format: true
    punctuate: true

audio:
  sample_rate: 16000
  channels: 1
  block_size: 2048

logging:
  level: "info"

engine:
  stop_timeout: 30

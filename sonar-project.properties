# SonarQube project configuration
# Documentation: https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/scanners/sonarscanner/

# Project identification (must be unique in a given SonarQube instance)
sonar.projectKey=voice-to-text
sonar.projectName=Voice to Text
sonar.projectVersion=1.0

# Source configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python version(s) analyzed
sonar.python.version=3.13

# Exclusions (files/patterns to skip)
sonar.exclusions=**/debug.py,**/__pycache__/**,**/*.pyc

# Coverage report (generate with: uv run pytest --cov=voice_to_text --cov-report=xml)
# sonar.python.coverage.reportPaths=coverage.xml

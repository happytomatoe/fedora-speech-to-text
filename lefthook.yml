# Lefthook configuration
# https://lefthook.dev/configuration

pre-commit:
  parallel: true
  commands:
    knip:
      run: npx knip
      glob: "*.{ts,js,json}"
    check-dbus-service-name:
      run: uv run pytest tests/test_dbus_service_name.py -q
      glob: "*.{py,js,xml}"
    check-merge-conflict:
      run: bash -c 'matches=$(grep -rn --exclude-dir=.venv --exclude-dir=node_modules "^<<<<<<< \|^=======$\|^>>>>>>> " {staged_files}); if [ -n "$matches" ]; then echo "$matches"; exit 1; fi'
      glob: "*.{py,js,sh,css,json,xml,yaml,yml,toml,md}"
    uv-sync:
      run: uv sync
      glob: "*.{py,toml,lock}"
    ruff-lint:
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      glob: "*.py"
    oxlint:
      run: npx oxlint {staged_files}
      glob: "gnome-ext/**/*.js"
    npm-install:
      run: npm install --ignore-scripts 2>/dev/null || true
      glob: "package.json"
    gjs-syntax:
      run: bash -c 'for f in {staged_files}; do node --input-type=module --check < "$f" || exit 1; done'
      glob: "gnome-ext/**/*.js"
    gjs-ts-check:
      run: npx tsc --noEmit
      glob: "gnome-ext/**/*.js"
    gjs-gtk4-test:
      run: gjs --module gnome-ext/tests/test-gtk4-api.js
      glob: "gnome-ext/tests/**/*.js"
    gjs-schema-check:
      run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('gnome-ext/schemas/org.gnome.shell.extensions.voice-to-text.gschema.xml')"
      glob: "gnome-ext/schemas/*.xml"
    prettier:
      run: npx prettier@3.8.4 --check {staged_files} --write
      glob: "gnome-ext/**/*.{js,css,json}"
    justfile-fmt:
      run: just --fmt --check 2>/dev/null || just --fmt
      glob: "justfile"

commit-msg:
  commands:
    no-co-authored-by:
      run: bash scripts/no-co-authored-by.sh {1}

pre-push:
  commands:
    metrics:
      # Disabled: measurement-only metrics run (uncomment to enforce on push)
      # run: just metrics
      # glob: "*.{py,js,toml,lock}"
    pytest:
      run: uv run pytest -n auto
      glob: "*.{py,js,toml,lock}"
    vulture:
      run: uv run vulture src/ --min-confidence 80
      glob: "*.py"
    e2e-test:
      # Runs via `just e2e` so behavior matches manual runs (incl. always-on
      # tee of full output to /tmp/fedora-speech-to-text-e2e-run.log).
      # Base image + cloud-init ISO are REQUIRED — fail hard if missing.
      run: bash -c 'if [ ! -f e2e/qemu-images/base.qcow2 ] || [ ! -f e2e/qemu-images/cloud-init.iso ]; then printf "ERROR - E2E environment not set up (missing e2e/qemu-images/base.qcow2 or e2e/qemu-images/cloud-init.iso)\nRun just qemu-e2e-setup first\n" >&2; exit 1; fi; just e2e'
      interactive: true

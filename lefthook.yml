# Lefthook configuration
# https://lefthook.dev/configuration

pre-commit:
  parallel: true
  commands:
    check-merge-conflict:
      run: bash -c 'matches=$(grep -rn "^<<<<<<< \\|^=======$\\|^>>>>>>> " {staged_files}); if [ -n "$matches" ]; then echo "$matches"; exit 1; fi'
      glob: "*.{py,js,sh,css,json,xml,yaml,yml,toml,md}"
    uv-sync:
      run: uv sync
      glob: "*.{py,toml,lock}"
    ruff-lint-format:
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      glob: "*.py"
      stage_fixed: true
    eslint:
      run: bash -c 'npm ci 2>/dev/null || npm install 2>/dev/null; for f in {staged_files}; do npx eslint --stdin --stdin-filename="$f" < "$f" || exit 1; done'
      glob: "gnome-ext/**/*.js"
    gjs-syntax:
      run: bash -c 'for f in {staged_files}; do node --input-type=module --check < "$f" || exit 1; done'
      glob: "gnome-ext/**/*.js"
    gtk4-api-check:
      run: gjs gnome-ext/tests/test-gtk4-api.js
      glob: "gnome-ext/tests/**/*.js"
    gschema-validate:
      run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('gnome-ext/schemas/org.gnome.shell.extensions.voice-to-text.gschema.xml')"
      glob: "gnome-ext/schemas/*.xml"
    prettier-check:
      run: npx prettier@3.8.4 --check {staged_files}
      glob: "gnome-ext/**/*.{js,css,json}"
    pytest:
      run: uv run pytest -n auto
      glob: "*.{py,js,toml,lock}"
      interactive: true

commit-msg:
  commands:
    no-co-authored-by:
      run: bash scripts/no-co-authored-by.sh {1}

pre-push:
  commands:
    e2e-test:
      run: bash -c 'if [ -f e2e/qemu-images/base.qcow2 ]; then cd e2e && bun run e2e.ts --shutdown; else echo "Skipping e2e test (VM image not found)"; fi'
      interactive: true

[project]
name = "voice-to-text"
version = "0.1.0"
description = "Voice to Text using Groq Whisper and Voxtral APIs"
requires-python = ">=3.13"
dependencies = [
  "groq~=1.2.0",
  "sounddevice~=0.5.5",
  "numpy~=2.4.4",
  "pyyaml~=6.0.3",
  "python-dotenv~=1.2.2",
  "httpx~=0.28.0",
  "websockets~=14.0",
  "dbus-next~=0.2.3",
  "mistralai[realtime]~=2.4,!=2.4.6",
  "moonshine-voice~=0.1.1",
  "onnxruntime>=1.17.0",
  "jellyfish~=1.2.1",
  "rapidfuzz~=3.14.5",
]

[project.scripts]
voice-to-text-dbus = "voice_to_text.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_to_text"]
exclude = ["src/voice_to_text/debug.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "PERF", "PL", "D", "SIM", "C90", "TID", "RUF", "FA", "LOG", "ICN"]
ignore = ["D203", "D213", "SIM105", "D401", "D400", "D415", "D205", "D301", "E501", "B904", "C901", "RUF006", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLW1510", "PLW0108", "RUF003", "RUF005"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "PLC0415", "PLR2004"]
"scripts/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "PLC0415", "PLR2004", "PLR0913", "PLR0917", "B007", "PERF102"]
"src/**" = ["D101", "D102", "D103", "D107", "PLC0415", "PLR2004"]

[tool.mypy]
ignore_missing_imports = true

[tool.pyright]
# dbus-next, groq, and sounddevice have incomplete type stubs
reportMissingTypeStubs = false
# Pre-existing errors in dbus_service.py, voxtral.py, typer.py, __main__.py
reportPrivateImportUsage = false
reportCallIssue = false
reportInvalidTypeForm = false
reportOptionalMemberAccess = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.5.0",
    "pyright>=1.1.398",
    "ruff>=0.15.0",
    "types-requests",
    "types-PyYAML",
]

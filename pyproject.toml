[project]
name = "voice-to-text"
version = "0.1.0"
description = "Voice to Text using Groq Whisper and Voxtral APIs"
requires-python = ">=3.13"
dependencies = [
  "groq~=1.2.0",
  "sounddevice~=0.5.5",
  "numpy~=2.4.4",
  "pyyaml~=6.0.3",
  "python-dotenv~=1.2.2",
  "httpx~=0.28.0",
  "websockets~=14.0",
  "dbus-next~=0.2.3",
  "mistralai[realtime]~=2.4,!=2.4.6",
  "moonshine-voice~=0.1.1",
]

[project.scripts]
voice-to-text-dbus = "voice_to_text.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_to_text"]
exclude = ["src/voice_to_text/debug.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "PERF", "PL", "D", "SIM", "C90", "TID", "RUF", "FA", "LOG", "ICN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "PLC0415", "PLR2004"]
"e2e-ci/**" = ["D", "N802"]  # harness fixtures: dbus method names must stay PascalCase (D-Bus spec)
"ci-e2e/**" = ["D", "PLR2004"]  # standalone harness scripts
"metrics/**" = ["D100", "D103", "PLR2004", "E741"]

[tool.mypy]
ignore_missing_imports = true

[tool.pyright]
# dbus-next, groq, and sounddevice have incomplete type stubs
reportMissingTypeStubs = false
# Pre-existing errors in dbus_service.py, voxtral.py, typer.py, __main__.py
reportPrivateImportUsage = false
reportCallIssue = false
reportInvalidTypeForm = false
reportOptionalMemberAccess = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.5.0",
    "pyright>=1.1.398",
    "ruff>=0.15.0",
    "types-requests",
    "types-PyYAML",
    "vulture>=2.16",
    "radon>=6.0.1",
    "complexipy>=7.0.1",
    "pytest-cov>=7.1.0",
    "mutmut>=3.7.0",
]

[tool.mutmut]
source_paths = ["src/voice_to_text/"]
also_copy = ["config.yaml", "service/", "gnome-ext/"]
# tests_dir is deprecated in mutmut 3.7+; pass test selection via pytest args instead
pytest_add_cli_args_test_selection = ["tests/"]

version: 1

rules:
  # GNOME Shell extension logs to the Shell journal via console.* — that IS the
  # GJS logging convention; oxlint no-console is already off for gnome-ext/.
  ai-slop/console-leftover: "off"
  # Static analyzer cannot resolve GNOME resource:/// module namespaces
  # (Main.wm, Main.inputMethod, MessageTray.Notification, PanelMenu.Button).
  # All verified present at runtime; per-line ignores exist where feasible.
  import/namespace: "off"
  # Provider API base URLs are stable public endpoints, already overridable
  # via config.yaml (config.get("api_url", default)) — not deployment secrets.
  ai-slop/hardcoded-url: "off"
  # typer.py:141 is dotool's documentation link inside a user-facing error
  # message; the rule's own guidance says stable documentation links stay.
  # (covered with the rule above)

ci:
  failBelow: 75

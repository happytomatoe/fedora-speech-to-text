name: POC Approach 1 - Fedora Container

# Approach 1: run headless GNOME Shell inside a Fedora container on a
# GitHub-hosted ubuntu-latest runner. Tests whether the container's lack of
# systemd/logind blocks gnome-shell, and what the rendered output looks like.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/poc-approach1-fedora-container.yml"

jobs:
  fedora-container-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:latest
      options: --user root
    steps:
      - name: Install GNOME Shell + deps (dnf)
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gnome-shell dbus-x11 glib2 gsettings-desktop-schemas \
            mesa-dri-drivers mesa-libgbm \
            curl git findutils procps-ng shadow-utils

      - name: Create non-root user
        run: |
          useradd -m -u 1000 tester || true
          chmod -R 777 /github/home 2>/dev/null || true

      - name: Boot headless gnome-shell + screenshot
        run: |
          su - tester -c '
            export XDG_RUNTIME_DIR=/tmp/xdg
            mkdir -p $XDG_RUNTIME_DIR && chmod 0700 $XDG_RUNTIME_DIR

            dbus-run-session -- bash -c "
              gnome-shell --headless --wayland --no-x11 \
                --virtual-monitor 1280x720 > /tmp/shell.log 2>&1 &
              GPID=\$!
              sleep 15

              if kill -0 \$GPID 2>/dev/null; then
                echo \"=== SHELL ALIVE after 15s ===\"
              else
                echo \"=== SHELL DEAD ===\"
                cat /tmp/shell.log
                exit 1
              fi

              ls \$XDG_RUNTIME_DIR/wayland-0 && echo \"=== WAYLAND SOCKET OK ===\"

              # Try screenshot via gnome-screenshot or grim equivalent
              # Fedora container: use dbus screenshot portal
              gdbus call --session \
                --dest org.gnome.Shell.Screenshot \
                --object-path /org/gnome/Shell/Screenshot \
                --method org.gnome.Shell.Screenshot.Screenshot \
                true false /tmp/poc-screenshot.png 2>&1 || echo \"SCREENSHOT_FAILED\"

              kill \$GPID 2>/dev/null
              tail -20 /tmp/shell.log
            "
          '

      - name: Collect logs
        if: always()
        run: |
          echo "=== shell.log ==="
          cat /tmp/shell.log 2>/dev/null || echo "no log"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-approach1-fedora-artifacts
          path: |
            /tmp/poc-screenshot.png
            /tmp/shell.log
          if-no-files-found: warn
          retention-days: 7

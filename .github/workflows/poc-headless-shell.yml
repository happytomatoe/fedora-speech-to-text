name: POC Headless GNOME Shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/poc-headless-shell.yml"
      - ".github/workflows/scripts/headless-gnome-shell.sh"
      - "docs/plans/poc-headless-shell-ci.md"

jobs:
  headless-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install GNOME Shell (no VM, no container)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell gnome-shell-common glib2.0-bin dbus \
            mesa-utils libgl1-mesa-dri libgbm1 \
            dconf-gsettings-backend gsettings-desktop-schemas

      - name: Boot headless GNOME Shell and screenshot
        run: |
          .github/workflows/scripts/headless-gnome-shell.sh poc-screenshot.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: poc-headless-shell-screenshot
          path: poc-screenshot.png
          if-no-files-found: error
          retention-days: 7

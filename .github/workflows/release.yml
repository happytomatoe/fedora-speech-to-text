name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Python Semantic Release
        id: release
        run: |
          uv run semantic-release version
          uv run semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Python package
        if: steps.release.outcome == 'success'
        run: uv build --out-dir dist

      - name: Pack GNOME extension
        if: steps.release.outcome == 'success'
        run: |
          UUID="voice-to-text@happytomatoe.com"
          SRC="gnome-ext"
          rm -rf "dist/$UUID"
          mkdir -p "dist/$UUID/schemas"
          VERSION_NUM=$(echo "${{ steps.release.outputs.tag }}" | sed 's/^v//')
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION_NUM\"/g" "$SRC"/metadata.json

          cp "$SRC"/*.js "$SRC"/*.json "$SRC"/*.css "dist/$UUID/"
          cp "$SRC"/schemas/*.xml "dist/$UUID/schemas/"
          cp "$SRC"/metadata.json "dist/$UUID/"
          glib-compile-schemas "dist/$UUID/schemas/"
          cd "dist/$UUID" && zip -r "../$UUID.shell-extension.zip" ./*

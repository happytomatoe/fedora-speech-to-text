name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Python package
        run: uv build --out-dir dist

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Pack GNOME extension
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list && sudo apt-get update && sudo apt-get install -y rsync zip libglib2.0-bin
          VERSION_NUM=$(echo "${{ steps.tag_version.outputs.new_tag }}" | sed 's/^v//')
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION_NUM\"/g" gnome-ext/metadata.json
          just gnome-ext-pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          files: |
            dist/voice_to_text-*.whl
            dist/voice_to_text-*.tar.gz
            dist/voice-to-text@happytomatoe.com.shell-extension.zip
          generate_release_notes: true

# E2E on Ubuntu 26.04 — CI-identical path: boots the SAME pinned resolute
# cloud image the local suite uses, deploys the extension, runs the basic
# record → transcribe → typed test inside QEMU (runner exposes /dev/kvm).
name: ubuntu-ci-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ubuntu-ci-e2e.yml"
      - "e2e/**"
      - "e2e-vm/setup-vm.sh"
      - "gnome-ext/**"
      - "src/voice_to_text/**"

jobs:
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install virtualization + image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils libguestfs-tools wget

      - name: Set up just, uv, bun
        run: |
          curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          curl -LsSf https://astral.sh/uv/install.sh | sh
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore cached golden image
        id: golden-cache
        uses: actions/cache@v4
        with:
          path: |
            e2e/golden-ubuntu-2604.qcow2
            e2e/ubuntu-2604-cloud.qcow2
            e2e/id_ed25519
            e2e/id_ed25519.pub
          key: ubuntu-golden-${{ hashFiles('e2e/setup-ubuntu-vm.sh') }}-resolute-current

      - name: Build golden image (pinned resolute + CI apt list + GDM autologin)
        if: steps.golden-cache.outputs.cache-hit != 'true'
        run: just e2e-setup-ubuntu

      - name: Run E2E suite (ubuntu-ci)
        run: just e2e ubuntu-ci

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/output/
          if-no-files-found: warn

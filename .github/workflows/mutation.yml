name: Mutation Testing

# mutmut runs take ~6 min on current suite size.
# Only runs on PRs touching src/tests/deps.
# mutants/ is cached so incremental runs only re-test changed mutants.
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-mutmut:
    runs-on: ubuntu-latest # 4 vCPU / 16 GB — enough for --max-children 4
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore mutmut cache
        uses: actions/cache@v4
        with:
          path: mutants/
          # v2: bust cache after VAD removal (deleted tests lingered in old mutants dirs)
          key: mutmut-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: mutmut-v2-${{ runner.os }}-

      - name: Run mutmut
        run: uv run mutmut run --max-children 4

      - name: Summarize mutation results
        if: always()
        run: |
          uv run python - <<'EOF'
          import json, glob, collections
          from mutmut.__main__ import status_by_exit_code
          stats = collections.Counter()
          for meta in glob.glob("mutants/**/*.meta", recursive=True):
              try:
                  d = json.load(open(meta))
              except (json.JSONDecodeError, OSError):
                  continue
              for code in d.get("exit_code_by_key", {}).values():
                  stats[status_by_exit_code[code].replace(" ", "_")] += 1
          killed, survived, no_tests = stats["killed"], stats["survived"], stats["no_tests"]
          total = sum(stats.values())
          denom = killed + survived
          print()
          print("+---------------+---------+--------+")
          print("| Status        | Count   | %      |")
          print("+---------------+---------+--------+")
          rows = [("Killed 🎉", killed), ("Survived 🙁", survived), ("No tests 🫥", no_tests),
                  ("Timeout ⏰", stats["timeout"]),
                  ("Other", total - killed - survived - no_tests - stats["timeout"] - stats.get("suspicious", 0) - stats.get("skipped", 0) - stats.get("segfault", 0) - stats.get("caught_by_type_check", 0))]
          for name, c in rows:
              pct = f"{c * 100 / total:.1f}%" if total else "-"
              print(f"| {name:<13} | {c:<7} | {pct:<6} |")
          print("+---------------+---------+--------+")
          print(f"| Total         | {total:<7} |        |")
          print("+---------------+---------+--------+")
          if denom:
              print(f"Mutation score (killed / (killed+survived)): {killed * 100 / denom:.1f}%")
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results
          path: mutants/
          retention-days: 30

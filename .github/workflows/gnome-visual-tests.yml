name: GNOME Extension Visual Tests

on:
  pull_request:
    paths:
      - '.github/workflows/gnome-visual-tests.yml'
      - '.containerignore'
      - 'gnome-ext/**'
      - 'tests/e2e/**'
      - 'tests/gnome-references/**'
      - 'src/voice_to_text/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gnome-visual-tests.yml'
      - '.containerignore'
      - 'gnome-ext/**'
      - 'tests/e2e/**'
      - 'tests/gnome-references/**'
      - 'src/voice_to_text/**'

jobs:
  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman imagemagick

      - name: Build test container
        run: |
          podman build -t voice-to-text-e2e \
            -f tests/e2e/Containerfile .

      - name: Run visual tests
        run: |
          chmod +x tests/e2e/*.sh
          tests/e2e/snapshot.sh

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: tests/gnome-output/
          retention-days: 7

  # Separate job for PR comments (needs issues: write for fork PRs)
  comment-on-failure:
    name: Comment on PR
    needs: visual-tests
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on PR with diff images
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const outputDir = 'tests/gnome-output';
            let diffFiles = [];
            try {
              diffFiles = fs.readdirSync(outputDir)
                .filter(f => f.endsWith('-diff.png'));
            } catch (e) {
              console.error(e);
              return; // no output dir means tests didn't run
            }
            
            if (diffFiles.length === 0) return;
            
            let body = '## Visual Regression Test Results\n\n';
            body += '❌ Some visual tests failed. Diff images:\n\n';
            
            for (const file of diffFiles) {
              body += `- \`${file}\`\n`;
            }
            
            body += '\nDownload the full artifacts to inspect the differences.\n';
            body += 'To update references, run `just e2e-references` locally and commit.\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

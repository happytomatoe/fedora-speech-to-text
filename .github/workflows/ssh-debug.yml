name: SSH Debug

on:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup tmate session
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Comment SSH command on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH_CMD="${{ steps.tmate.outputs.ssh-command }}"
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "### 🔌 SSH Debug Session
          \`\`\`
          $SSH_CMD
          \`\`\`
          Session runs for **10 minutes**."

      - name: Keep alive
        run: sleep 600

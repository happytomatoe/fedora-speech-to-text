name: CI

on:
  pull_request:

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev \
            gjs \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 \
            gir1.2-gio-2.0 \
            gir1.2-glib-2.0 \
            gir1.2-gobject-2.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Cache Silero VAD model
        uses: actions/cache@v4
        with:
          path: ~/.cache/voice-to-text/silero_vad.onnx
          key: silero-vad-v5.0

      - name: Download Silero VAD model
        run: |
          mkdir -p ~/.cache/voice-to-text
          if [ ! -f ~/.cache/voice-to-text/silero_vad.onnx ]; then
            wget -q -L -O ~/.cache/voice-to-text/silero_vad.onnx \
              https://github.com/snakers4/silero-vad/raw/v5.0/files/silero_vad.onnx
          fi

      - name: Run lefthook pre-commit checks
        run: npx lefthook run pre-commit --all-files --no-tty

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache Silero VAD model
        uses: actions/cache@v4
        with:
          path: ~/.cache/voice-to-text/silero_vad.onnx
          key: silero-vad-v5.0

      - name: Download Silero VAD model
        run: |
          mkdir -p ~/.cache/voice-to-text
          if [ ! -f ~/.cache/voice-to-text/silero_vad.onnx ]; then
            wget -q -L -O ~/.cache/voice-to-text/silero_vad.onnx \
              https://github.com/snakers4/silero-vad/raw/v5.0/files/silero_vad.onnx
          fi

      - name: Run tests
        run: uv run python -m pytest

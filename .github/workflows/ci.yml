name: CI

on:
  pull_request:

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev \
            gjs \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 \
            gir1.2-gio-2.0 \
            gir1.2-glib-2.0 \
            gir1.2-gobject-2.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Get Silero model URL from source
        run: |
          MODEL_URL=$(python -c "
          import ast
          with open('src/voice_to_text/vad.py') as f:
              tree = ast.parse(f.read())
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'DEFAULT_MODEL_URL':
                          print(ast.literal_eval(node.value))
          ")
          echo "MODEL_URL=$MODEL_URL" >> $GITHUB_ENV

      - name: Cache Silero VAD model
        uses: actions/cache@v4
        with:
          path: ~/.cache/voice-to-text/silero_vad.onnx
          key: silero-vad-${{ env.MODEL_URL }}

      - name: Download Silero VAD model
        run: |
          mkdir -p ~/.cache/voice-to-text
          if [ ! -f ~/.cache/voice-to-text/silero_vad.onnx ]; then
            wget -q -L -O ~/.cache/voice-to-text/silero_vad.onnx "$MODEL_URL"
          fi

      - name: Run lefthook pre-commit checks
        run: npx lefthook run pre-commit --all-files --no-tty

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Get Silero model URL from source
        run: |
          MODEL_URL=$(python -c "
          import ast
          with open('src/voice_to_text/vad.py') as f:
              tree = ast.parse(f.read())
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'DEFAULT_MODEL_URL':
                          print(ast.literal_eval(node.value))
          ")
          echo "MODEL_URL=$MODEL_URL" >> $GITHUB_ENV

      - name: Cache Silero VAD model
        uses: actions/cache@v4
        with:
          path: ~/.cache/voice-to-text/silero_vad.onnx
          key: silero-vad-${{ env.MODEL_URL }}

      - name: Download Silero VAD model
        run: |
          mkdir -p ~/.cache/voice-to-text
          if [ ! -f ~/.cache/voice-to-text/silero_vad.onnx ]; then
            wget -q -L -O ~/.cache/voice-to-text/silero_vad.onnx "$MODEL_URL"
          fi

      - name: Run tests
        run: uv run python -m pytest

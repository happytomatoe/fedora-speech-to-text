name: CI

on:
  pull_request:

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev \
            gjs \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 \
            gir1.2-gio-2.0 \
            gir1.2-glib-2.0 \
            gir1.2-gobject-2.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: |
          uv sync --locked
          bun install --frozen-lockfile

      - name: Get Silero model URL from source
        run: |
          MODEL_URL=$(sed -n 's/.*DEFAULT_MODEL_URL = "\([^"]*\)".*/\1/p' src/voice_to_text/vad.py)
          echo "MODEL_URL=$MODEL_URL" >> $GITHUB_ENV

      - name: Cache Silero VAD model
        uses: actions/cache@v4
        with:
          path: ~/.cache/voice-to-text/silero_vad.onnx
          key: silero-vad-${{ env.MODEL_URL }}

      - name: Download Silero VAD model
        run: |
          mkdir -p ~/.cache/voice-to-text
          if [ ! -f ~/.cache/voice-to-text/silero_vad.onnx ]; then
            wget -q -L -O ~/.cache/voice-to-text/silero_vad.onnx "$MODEL_URL"
          fi

      - name: Run lefthook pre-commit checks
        # --no-auto-install: lefthook 2.x's auto hook-install panics in CI (nil deref, install.go)
        run: npx lefthook run pre-commit --all-files --no-tty --no-auto-install

      - name: Run ego-lint (EGO compliance)
        run: ./scripts/ego-lint --show=fail,warn gnome-ext/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Get Silero model URL from source
        run: |
          MODEL_URL=$(sed -n 's/.*DEFAULT_MODEL_URL = "\([^"]*\)".*/\1/p' src/voice_to_text/vad.py)
          echo "MODEL_URL=$MODEL_URL" >> $GITHUB_ENV

      - name: Cache Silero VAD model
        uses: actions/cache@v4
        with:
          path: ~/.cache/voice-to-text/silero_vad.onnx
          key: silero-vad-${{ env.MODEL_URL }}

      - name: Download Silero VAD model
        run: |
          mkdir -p ~/.cache/voice-to-text
          if [ ! -f ~/.cache/voice-to-text/silero_vad.onnx ]; then
            wget -q -L -O ~/.cache/voice-to-text/silero_vad.onnx "$MODEL_URL"
          fi

      - name: Run tests
        run: uv run python -m pytest

  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Complexity (sonarjs, max 2 findings)
        # thresholds pinned to current baseline (2026-09-02); tighten later via issue "Enable JS quality gates"
        run: npx eslint --no-warn-ignored --config metrics/eslint.config.metrics.mjs --max-warnings 2 'gnome-ext/**/*.js'

      - name: Type check (tsc checkJs)
        run: npx tsc --noEmit

      - name: Dead code (knip)
        run: bunx knip

      - name: Duplication (jscpd, max 1%)
        run: bunx jscpd src/ gnome-ext/ --min-tokens 50 --threshold 1 --silent

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Cyclomatic complexity (radon, report C or worse)
        run: uv run radon cc --min C --total-average src/

      - name: Cognitive complexity (complexipy, max 91 = current worst function)
        run: uv run complexipy src/ --max-complexity-allowed 91 -q

      - name: Dead code (vulture)
        run: uv run vulture src/ --min-confidence 80

      - name: Type check (pyright, max 3 errors = current baseline)
        # pyright has no error-count-limit flag; count via outputjson
        run: |
          uv run pyright --outputjson src/ > /tmp/pyright.json || true
          ERRORS=$(python3 -c "import json; print(json.load(open('/tmp/pyright.json'))['summary']['errorCount'])")
          test "$ERRORS" -le 3 || { echo "pyright errors: $ERRORS (limit 3)"; exit 1; }

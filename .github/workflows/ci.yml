name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m pytest

  sonar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better blame data

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman jq

      - name: Set vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Cache SonarQube images
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/containers/storage
          key: sonar-images-${{ runner.os }}-${{ hashFiles('sonar-project.properties') }}
          restore-keys: |
            sonar-images-${{ runner.os }}-

      - name: Run SonarQube scan
        run: |
          chmod +x scripts/sonar-scan.sh
          scripts/sonar-scan.sh --fail-on-gate --reports-dir sonar-reports
        env:
          SONAR_PORT: "9000"

      - name: Upload SonarQube reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-reports
          path: sonar-reports/
          retention-days: 30

      - name: Comment PR with quality gate status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read quality gate
            let gateStatus = 'UNKNOWN';
            try {
              const gateJson = JSON.parse(
                fs.readFileSync('sonar-reports/quality-gate.json', 'utf8')
              );
              gateStatus = gateJson.projectStatus?.status || 'UNKNOWN';
            } catch (e) {
              console.log('Could not read quality gate:', e.message);
            }

            // Read metrics
            let metrics = {};
            try {
              const metricsJson = JSON.parse(
                fs.readFileSync('sonar-reports/metrics.json', 'utf8')
              );
              for (const m of metricsJson.component?.measures || []) {
                metrics[m.metric] = m.value;
              }
            } catch (e) {
              console.log('Could not read metrics:', e.message);
            }

            // Read issues count
            let issueCount = 0;
            try {
              const issuesJson = JSON.parse(
                fs.readFileSync('sonar-reports/issues.json', 'utf8')
              );
              issueCount = issuesJson.issues?.length || 0;
            } catch (e) {
              console.log('Could not read issues:', e.message);
            }

            const gateEmoji = gateStatus === 'OK' ? '✅' : '❌';
            const body = `## ${gateEmoji} SonarQube Quality Gate: ${gateStatus}

            | Metric | Value |
            |--------|-------|
            | Lines of Code | ${metrics.ncloc || '—'} |
            | Bugs | ${metrics.bugs || '0'} |
            | Vulnerabilities | ${metrics.vulnerabilities || '0'} |
            | Code Smells | ${metrics.code_smells || '0'} |
            | Security Hotspots | ${metrics.security_hotspots || '0'} |
            | Coverage | ${metrics.coverage || '0'}% |
            | Duplications | ${metrics.duplicated_lines_density || '0'}% |
            | Open Issues | ${issueCount} |

            [📊 View full report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const sonarComment = comments.find(
              c => c.body.includes('SonarQube Quality Gate')
            );

            if (sonarComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: sonarComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

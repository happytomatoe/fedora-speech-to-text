name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install E2E dependencies
        run: cd e2e && bun install

      # Cache the 1.7GB base image
      - name: Restore base image from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: e2e/qemu-images/golden-gnome-deps.qcow2
          key: e2e-base-image-v1
          restore-keys: |
            e2e-base-image-

      # Run E2E tests (generates SSH keys, cloud-init, etc.)
      - name: Run E2E tests
        run: cd e2e && bun run e2e.ts --shutdown --timeout 300

      # Save to cache on success (only if cache miss)
      - name: Save base image to cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: e2e/qemu-images/golden-gnome-deps.qcow2
          key: e2e-base-image-v1

      # Upload artifacts on failure
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e/output/
          retention-days: 7

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage podman

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install E2E dependencies
        run: cd e2e && bun install

      - name: Install Filen CLI
        run: npm install -g @filen/cli

      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin

      # Cache all E2E files
      - name: Restore E2E files from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: e2e/qemu-images/
          key: e2e-files-v2
          restore-keys: |
            e2e-files-

      # Setup E2E environment (downloads image, generates keys, etc.)
      - name: Setup E2E environment
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: just qemu-e2e-setup
        env:
          FILEN_EMAIL: ${{ secrets.FILEN_EMAIL }}
          FILEN_PASSWORD: ${{ secrets.FILEN_PASSWORD }}

      # Run E2E tests
      - name: Run E2E tests
        run: cd e2e && bun run e2e.ts --shutdown --timeout 300

      # Save to cache on success (only if cache miss)
      - name: Save E2E files to cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: e2e/qemu-images/
          key: e2e-files-v2

      # Upload artifacts on failure
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e/output/
          retention-days: 7

name: POC Approach 2 - Fedora VM (QEMU)

# Approach 2: boot a full Fedora VM on a GitHub-hosted runner using QEMU.
# Tests whether a real GDM/systemd session renders correctly, and captures
# a screenshot from outside the VM via QMP screendump.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/poc-approach2-fedora-vm.yml"

jobs:
  fedora-vm-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM available"
            echo "kvm=true" >> $GITHUB_OUTPUT
          else
            echo "KVM NOT available, falling back to TCG (slow)"
            echo "kvm=false" >> $GITHUB_OUTPUT
          fi

      - name: Install QEMU + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils wget curl \
            genisoimage cloud-image-utils

      - name: Download Fedora Cloud image
        run: |
          # Fedora 41 Cloud Base image (qcow2)
          wget -q --show-progress \
            "https://download.fedoraproject.org/pub/fedora/linux/releases/41/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-41-1.4.x86_64.qcow2" \
            -O fedora-cloud.qcow2
          ls -lh fedora-cloud.qcow2

      - name: Create cloud-init seed
        run: |
          cat > user-data <<'EOF'
          #cloud-config
          hostname: fedora-e2e
          users:
            - name: tester
              sudo: ALL=(ALL) NOPASSWD:ALL
              groups: wheel
              shell: /bin/bash
              lock_passwd: true
              ssh_authorized_keys:
                - github-actions-placeholder
          ssh_pwauth: false
          runcmd:
            - dnf install -y gnome-shell gnome-session gdm dbus-x11 \
                mesa-dri-drivers mesa-libgbm xorg-x11-server-Xorg
            - systemctl set-default graphical.target
          EOF

          cat > meta-data <<'EOF'
          instance-id: fedora-e2e-001
          local-hostname: fedora-e2e
          EOF

          cloud-localds seed.img user-data meta-data

      - name: Resize disk + boot VM
        run: |
          qemu-img resize fedora-cloud.qcow2 20G

          KVM_FLAG=""
          if [ "${{ steps.kvm.outputs.kvm }}" = "true" ]; then
            KVM_FLAG="-enable-kvm -cpu host"
          else
            KVM_FLAG="-cpu qemu64"
          fi

          # Boot with user-mode networking, no display (headless host),
          # QMP socket for screendump, SSH forwarded to host port 2222
          qemu-system-x86_64 \
            $KVM_FLAG \
            -m 4096 -smp 4 \
            -drive file=fedora-cloud.qcow2,format=qcow2,if=virtio \
            -drive file=seed.img,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -display none \
            -qmp unix:/tmp/qmp.sock,server,nowait \
            -daemonize \
            -pidfile /tmp/qemu.pid

          echo "QEMU started, PID: $(cat /tmp/qemu.pid)"

      - name: Wait for VM boot + SSH
        run: |
          echo "Waiting for SSH (up to 10 min)..."
          for i in $(seq 1 60); do
            if nc -z localhost 2222 2>/dev/null; then
              echo "SSH port open after ~${i}x10s"
              break
            fi
            sleep 10
          done

          # Try SSH connection
          ssh-keygen -t ed25519 -f /tmp/key -N "" -q
          # Inject key via cloud-init would need setup; use QMP to check status
          echo "=== QMP status check ==="
          echo '{"execute":"qmp_capabilities"}' | timeout 5 socat - UNIX-CONNECT:/tmp/qmp.sock || true

      - name: Take QMP screendump
        run: |
          # Wait for graphical target (GNOME desktop)
          sleep 60

          # Send screendump command via QMP
          python3 -c "
          import socket, json, time

          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.connect('/tmp/qmp.sock')

          # Read greeting
          data = sock.recv(4096)
          print('Greeting:', data.decode()[:200])

          # Enter command mode
          sock.send(json.dumps({'execute': 'qmp_capabilities'}).encode())
          time.sleep(0.5)
          sock.recv(4096)

          # Take screendump
          sock.send(json.dumps({
              'execute': 'screendump',
              'arguments': {'filename': '/tmp/poc-vm-screenshot.ppm'}
          }).encode())
          time.sleep(2)
          data = sock.recv(4096)
          print('Screendump result:', data.decode())

          sock.close()
          "

          # Convert PPM to PNG
          if [ -f /tmp/poc-vm-screenshot.ppm ]; then
            python3 -c "
          from PIL import Image
          img = Image.open('/tmp/poc-vm-screenshot.ppm')
          img.save('/tmp/poc-vm-screenshot.png')
          print('Converted to PNG')
          " || echo "PIL not available, keeping PPM"
            ls -lh /tmp/poc-vm-screenshot.*
          else
            echo "No screendump produced"
          fi

      - name: Collect VM logs
        if: always()
        run: |
          echo "=== QEMU process ==="
          cat /tmp/qemu.pid 2>/dev/null || echo "no pid"
          ps aux | grep qemu || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-approach2-fedora-vm-artifacts
          path: |
            /tmp/poc-vm-screenshot.*
          if-no-files-found: warn
          retention-days: 7

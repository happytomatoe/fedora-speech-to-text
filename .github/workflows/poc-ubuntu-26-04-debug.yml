name: POC Ubuntu 26.04 - GNOME 50 + tmate SSH debug

# Debug-first POC on the ubuntu-26.04 preview image (GNOME 50 — matches the
# local Fedora 44 dev env). Same bare-runner headless harness as the green
# baseline, plus an opt-in tmate SSH session so a stuck/failed run can be
# inspected live instead of blind push-and-pray.
#
# Trigger: workflow_dispatch with debug_enabled=true to land an SSH shell on
# the runner right after the harness step (or on failure). Connection string
# appears in the run logs and the Checks tab.

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Open an SSH (tmate) session on the runner for live debugging'
        required: false
        default: false
  pull_request:
    paths:
      - ".github/workflows/poc-ubuntu-26-04-debug.yml"
      - ".github/workflows/scripts/ci-e2e-headless.sh"
      - ".github/workflows/scripts/ci-e2e-headless-inner.sh"
      - "ci-e2e/**"
      - "gnome-ext/**"
      - "src/voice_to_text/**"

jobs:
  headless-e2e-gnome50-debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GNOME Shell + harness dependencies (no VM, no container)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell gnome-shell-common glib2.0-bin dbus \
            mesa-utils libgl1-mesa-dri libgbm1 \
            dconf-gsettings-backend gsettings-desktop-schemas \
            libportaudio2 \
            curl

      - name: Install + start PulseAudio with virtual devices (headless)
        run: |
          sudo apt-get install -y --no-install-recommends \
            pulseaudio pulseaudio-utils
          # Runner has no sound hardware; daemon must run with null devices
          # so PortAudio's PulseAudio host API can initialize.
          pulseaudio -D --exit-idle-time=-1 --disallow-exit=true \
            --load="module-null-sink sink_name=virtual_sink" \
            --load="module-null-source source_name=virtual_mic"
          # pulseaudio -D returns before the socket is ready; poll for it
          for i in $(seq 1 20); do
            pactl info >/dev/null 2>&1 && break
            sleep 1
          done
          pactl list short sinks
          pactl list short sources

      - uses: astral-sh/setup-uv@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install ci-e2e dependencies
        run: cd ci-e2e && bun install

      - name: Start Parakeet + boot headless GNOME Shell + run E2E
        run: |
          bash .github/workflows/scripts/ci-e2e-headless.sh \
            "$PWD/ci-e2e-screenshot-2604.png"

      - name: Setup tmate session (manual debug)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
        id: tmate

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e-headless-gnome50-artifacts
          path: |
            ci-e2e-screenshot-2604.png
          if-no-files-found: warn
          retention-days: 7

name: CI E2E Headless

# CI-only end-to-end test: headless GNOME Shell + extension + Python service +
# Parakeet container on a bare ubuntu-latest runner. No QEMU, no VM.
# See thoughts/shared/plans/ci-headless-e2e-test.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ci-e2e-headless.yml"
      - ".github/workflows/scripts/ci-e2e-headless.sh"
      - ".github/workflows/scripts/ci-e2e-headless-inner.sh"
      - "ci-e2e/**"
      - "gnome-ext/**"
      - "src/voice_to_text/**"

jobs:
  headless-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install GNOME Shell + harness dependencies (no VM, no container)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell gnome-shell-common glib2.0-bin dbus \
            mesa-utils libgl1-mesa-dri libgbm1 \
            dconf-gsettings-backend gsettings-desktop-schemas \
            curl

      - uses: astral-sh/setup-uv@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install ci-e2e dependencies
        run: cd ci-e2e && bun install

      - name: Start Parakeet + boot headless GNOME Shell + run E2E
        run: |
          .github/workflows/scripts/ci-e2e-headless.sh \
            "$PWD/ci-e2e-screenshot.png"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e-headless-artifacts
          path: |
            ci-e2e-screenshot.png
          if-no-files-found: warn
          retention-days: 7
